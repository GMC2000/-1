<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="بوابة أسبوع الفضاء العالمي - ثانوية الفرسان الأهلية بمكة المكرمة | المنصة العلمية التفاعلية الكبرى بتصميم Dark Glassmorphism الفاخر">
  <title>بوابة أسبوع الفضاء العالمي | ثانوية الفرسان الأهلية</title>

  <!-- أيقونة التبويب في المتصفح (Favicon) -->
  <link rel="icon" type="image/png" href="images/school_logo.png" onerror="this.href='https://upload.wikimedia.org/wikipedia/commons/e/e5/Venus-real_color.jpg'">

  <!-- Google Fonts: Cairo, JetBrains Mono, Orbitron -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;800&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. متغيرات الألوان والتصميم (Ultra-Modern Dark Glassmorphism)
       ========================================================================== */
    :root {
      --bg-space: #050711;
      --bg-panel: rgba(13, 19, 41, 0.62);
      --bg-panel-hover: rgba(20, 28, 60, 0.82);
      --bg-card-inner: rgba(7, 11, 26, 0.75);
      
      --cyan-neon: #00f2fe;
      --cyan-glow: rgba(0, 242, 254, 0.38);
      --violet-neon: #8b5cf6;
      --violet-glow: rgba(139, 92, 246, 0.38);
      --gold-royal: #fbbf24;
      --gold-glow: rgba(251, 191, 36, 0.35);
      --emerald-neon: #10b981;
      --rose-neon: #f43f5e;
      --amber-neon: #f59e0b;

      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-border-bright: rgba(0, 242, 254, 0.35);
      --glass-blur: blur(20px);
      --glass-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);

      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      --font-ar: 'Cairo', system-ui, -apple-system, sans-serif;
      --font-code: 'JetBrains Mono', monospace;
      --font-num: 'Orbitron', monospace;

      --radius-sm: 10px;
      --radius-md: 18px;
      --radius-lg: 26px;
      --radius-pill: 9999px;

      --trans-smooth: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-space);
      color: var(--text-main);
      font-family: var(--font-ar);
      min-height: 100vh;
      line-height: 1.7;
      overflow-x: hidden;
      position: relative;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #04060f;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #1e295d, #00f2fe);
      border-radius: 4px;
    }

    #space-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .cosmic-nebula {
      position: fixed;
      border-radius: 50%;
      filter: blur(150px);
      opacity: 0.35;
      pointer-events: none;
      z-index: 1;
      animation: floatNebula 24s infinite alternate ease-in-out;
    }
    .nebula-purple {
      top: -100px;
      right: 15%;
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, #7928ca 0%, transparent 70%);
    }
    .nebula-blue {
      bottom: 10%;
      left: -80px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, #0070f3 0%, transparent 70%);
      animation-delay: -10s;
    }
    .nebula-cyan {
      top: 45%;
      right: 35%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #00f2fe 0%, transparent 70%);
      animation-delay: -16s;
    }

    @keyframes floatNebula {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, -45px) scale(1.18); }
    }

    .platform-container {
      position: relative;
      z-index: 2;
      width: 93%;
      max-width: 1400px;
      margin: 0 auto;
      padding-top: 125px;
      padding-bottom: 70px;
    }

    /* ==========================================================================
       2. الشريط العلوي الزجاجي العائم (Floating Glass Navbar)
       ========================================================================== */
    .navbar-floating {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: min(1400px, calc(100% - 24px));
      z-index: 1000;
      background: rgba(11, 16, 38, 0.88);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-pill);
      padding: 8px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.65);
      transition: var(--trans-smooth);
    }

    .navbar-floating:hover {
      border-color: rgba(255, 255, 255, 0.22);
      box-shadow: 0 20px 50px rgba(0, 242, 254, 0.15);
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
      flex-shrink: 0;
    }

    .school-logo-slot {
      height: 44px;
      width: auto;
      max-width: 140px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0, 242, 254, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px 8px;
      flex-shrink: 0;
    }

    .school-logo-slot img {
      max-height: 100%;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      display: block;
    }

    .brand-headings h1 {
      font-size: 1.05rem;
      font-weight: 800;
      background: linear-gradient(90deg, #ffffff 40%, var(--cyan-neon) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
      line-height: 1.2;
      white-space: nowrap;
    }

    .brand-headings span {
      display: block;
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
    }

    /* شارة الطلاب المتحركة بنظام الشريط التلقائي المستمر */
    .dev-badge-capsule {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 242, 254, 0.25);
      border-radius: var(--radius-pill);
      padding: 5px 14px;
      width: 320px;
      max-width: 340px;
      overflow: hidden;
      flex-shrink: 1;
      position: relative;
      mask-image: linear-gradient(to right, transparent, black 12%, black 88%, transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 12%, black 88%, transparent);
    }

    .dev-marquee-track {
      display: inline-flex;
      white-space: nowrap;
      animation: devTickerLoop 18s linear infinite;
    }

    .dev-badge-capsule:hover .dev-marquee-track {
      animation-play-state: paused;
    }

    .dev-names-wrap {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 0.8rem;
      padding-left: 20px;
      padding-right: 20px;
    }

    .dev-names-wrap strong {
      color: var(--cyan-neon);
    }

    .dev-sep {
      color: var(--gold-royal);
      font-size: 0.8rem;
    }

    @keyframes devTickerLoop {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(50%);
      }
    }

    .status-pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald-neon);
      box-shadow: 0 0 8px var(--emerald-neon);
      flex-shrink: 0;
    }

    .nav-tools-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .nav-btn-icon {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 6px 11px;
      border-radius: var(--radius-pill);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
      transition: var(--trans-smooth);
      font-family: var(--font-ar);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .nav-btn-icon:hover {
      background: rgba(0, 242, 254, 0.18);
      border-color: var(--cyan-neon);
      color: var(--cyan-neon);
      transform: translateY(-2px);
    }

    .nav-btn-accent {
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.25), rgba(139, 92, 246, 0.25));
      border-color: var(--cyan-neon);
      color: #ffffff;
    }

    .nav-saudi-btn {
      background: rgba(6, 78, 59, 0.45);
      border-color: var(--emerald-neon);
      color: #ffffff;
    }

    .nav-nasa-btn {
      background: rgba(11, 61, 145, 0.4);
      border-color: var(--cyan-neon);
      color: #ffffff;
    }

    @media (max-width: 1024px) {
      .dev-badge-capsule {
        display: none;
      }
    }

    /* ==========================================================================
       3. بطاقات الإشراف والقيادة التعليمية
       ========================================================================== */
    .leadership-strip {
      margin-top: 28px;
      margin-bottom: 35px;
    }

    .leadership-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    .leader-card-glass {
      background: var(--bg-panel);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 22px 28px;
      display: flex;
      align-items: center;
      gap: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--glass-shadow);
      transition: var(--trans-smooth);
    }

    .leader-card-glass::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 4px;
      background: linear-gradient(180deg, var(--gold-royal), transparent);
    }

    .leader-card-glass.mentor-accent::after {
      background: linear-gradient(180deg, var(--cyan-neon), transparent);
    }

    .leader-card-glass:hover {
      transform: translateY(-4px);
      background: var(--bg-panel-hover);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .leader-icon-circle {
      width: 60px;
      height: 60px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .leader-icon-circle.gold {
      border-color: rgba(251, 191, 36, 0.4);
      color: var(--gold-royal);
      box-shadow: 0 0 20px rgba(251, 191, 36, 0.2);
    }

    .leader-icon-circle.cyan {
      border-color: rgba(0, 242, 254, 0.4);
      color: var(--cyan-neon);
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
    }

    .leader-details .role-tag {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 4px;
      display: block;
    }
    .role-gold { color: var(--gold-royal); }
    .role-cyan { color: var(--cyan-neon); }

    .leader-details h3 {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 3px;
    }

    .leader-details p {
      font-size: 0.84rem;
      color: var(--text-muted);
    }

    /* الأخبار العاجلة */
    .breaking-news-bar {
      background: rgba(14, 21, 46, 0.78);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-pill);
      padding: 10px 18px;
      margin-bottom: 45px;
      display: flex;
      align-items: center;
      gap: 16px;
      overflow: hidden;
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
      position: relative;
    }

    .news-badge {
      background: linear-gradient(90deg, #f43f5e, #e11d48);
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 800;
      padding: 6px 16px;
      border-radius: var(--radius-pill);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      box-shadow: 0 0 18px rgba(244, 63, 94, 0.45);
      z-index: 5;
    }

    .news-badge .pulse-icon {
      display: inline-block;
      animation: pulseAlert 1.4s infinite;
    }

    @keyframes pulseAlert {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.5; }
    }

    .news-marquee-track {
      flex: 1;
      overflow: hidden;
      direction: ltr;
      white-space: nowrap;
      position: relative;
      mask-image: linear-gradient(to right, transparent, black 3%, black 97%, transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 3%, black 97%, transparent);
    }

    .news-marquee-inner {
      display: inline-flex;
      white-space: nowrap;
      width: max-content;
      animation: continuousTicker 55s linear infinite;
    }

    .news-marquee-inner:hover {
      animation-play-state: paused;
    }

    .news-marquee-group {
      display: inline-flex;
      align-items: center;
      gap: 35px;
      padding-right: 35px;
    }

    .news-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: var(--text-main);
      direction: rtl;
    }

    .news-item span.source {
      color: var(--cyan-neon);
      font-weight: 800;
      background: rgba(0, 242, 254, 0.08);
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid rgba(0, 242, 254, 0.2);
    }

    .news-bullet-sep {
      color: var(--gold-royal);
      font-size: 0.9rem;
    }

    @keyframes continuousTicker {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* ==========================================================================
       4. رادار الطقس الفضائي الحي
       ========================================================================== */
    .section-glass-block {
      background: var(--bg-panel);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 34px;
      margin-bottom: 55px;
      box-shadow: var(--glass-shadow);
      position: relative;
    }

    .section-title-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 30px;
    }

    .section-heading-primary {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.7rem;
      font-weight: 800;
      color: #ffffff;
    }

    .section-heading-primary span.icon {
      font-size: 1.8rem;
    }

    .weather-radar-grid {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 30px;
      align-items: center;
    }

    .radar-screen-wrap {
      position: relative;
      width: 320px;
      height: 320px;
      margin: 0 auto;
      border-radius: 50%;
      background: radial-gradient(circle, #081226 0%, #030612 100%);
      border: 2px solid rgba(0, 242, 254, 0.4);
      box-shadow: 0 0 35px rgba(0, 242, 254, 0.25), inset 0 0 30px rgba(0, 242, 254, 0.15);
      overflow: hidden;
    }

    #radar-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .radar-stats-column {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .noaa-scales-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
    }

    .scale-card {
      background: var(--bg-card-inner);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      position: relative;
      transition: var(--trans-smooth);
    }

    .scale-card:hover {
      border-color: var(--cyan-neon);
      transform: translateY(-3px);
    }

    .scale-card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .scale-code {
      font-family: var(--font-num);
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--cyan-neon);
    }

    .scale-level-tag {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      background: rgba(16, 185, 129, 0.15);
      color: var(--emerald-neon);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .scale-level-tag.active-alert {
      background: rgba(245, 158, 11, 0.15);
      color: var(--amber-neon);
      border-color: rgba(245, 158, 11, 0.3);
    }

    .scale-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 5px;
    }

    .scale-impact {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .solar-telemetry-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .telemetry-chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      padding: 10px 18px;
      flex: 1;
      min-width: 140px;
      display: flex;
      flex-direction: column;
    }

    .telemetry-chip span.label {
      font-size: 0.72rem;
      color: var(--text-dim);
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .telemetry-chip span.val {
      font-family: var(--font-code);
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--cyan-neon);
    }

    .alerts-feed-strip {
      background: rgba(244, 63, 94, 0.08);
      border: 1px solid rgba(244, 63, 94, 0.25);
      border-radius: var(--radius-md);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 0.88rem;
    }

    .alerts-feed-strip strong {
      color: var(--rose-neon);
    }

    /* ==========================================================================
       5. النظام الشمسي والكواكب الثمانية
       ========================================================================== */
    .planets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin-bottom: 30px;
    }

    .planet-card-3d {
      background: var(--bg-card-inner);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 24px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      transition: var(--trans-smooth);
    }

    .planet-card-3d:hover {
      transform: translateY(-8px);
      border-color: var(--cyan-neon);
      box-shadow: 0 15px 35px var(--cyan-glow);
    }

    .planet-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .planet-visual-img {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 22px rgba(0, 242, 254, 0.35);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      transition: var(--trans-smooth);
      background: #030612;
      flex-shrink: 0;
    }

    .planet-card-3d:hover .planet-visual-img {
      transform: scale(1.18) rotate(10deg);
      border-color: var(--cyan-neon);
      box-shadow: 0 0 32px var(--cyan-neon);
    }

    .planet-title-wrap h4 {
      font-size: 1.35rem;
      font-weight: 800;
      color: #ffffff;
    }

    .planet-title-wrap span {
      font-size: 0.78rem;
      color: var(--cyan-neon);
      font-family: var(--font-code);
    }

    .planet-stats-table {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 15px;
      font-size: 0.85rem;
    }

    .planet-stat-row {
      display: flex;
      justify-content: space-between;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .planet-stat-row span.k { color: var(--text-muted); }
    .planet-stat-row span.v { font-family: var(--font-code); color: #ffffff; font-weight: 600; }

    .compare-tool-container {
      background: var(--bg-card-inner);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 24px;
      margin-top: 25px;
    }

    .compare-selectors-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 25px;
    }

    .select-glass-custom {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      color: #ffffff;
      padding: 12px 18px;
      border-radius: var(--radius-sm);
      font-family: var(--font-ar);
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
    }

    .select-glass-custom option {
      background: #0b1021;
